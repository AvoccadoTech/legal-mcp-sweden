[project]
name = "sweden-legal-mcp"
version = "0.1.0"
description = "Read-only MCP servers for Swedish public legal data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Avoccado Tech" }]
keywords = ["mcp", "sweden", "legal", "lifos", "migrationsverket", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/AvoccadoTech/legal-mcp-sweden"
Issues = "https://github.com/AvoccadoTech/legal-mcp-sweden/issues"

[project.scripts]
sweden-lifos-mcp = "sweden_legal_mcp.lifos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sweden_legal_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real Lifos feed"]
